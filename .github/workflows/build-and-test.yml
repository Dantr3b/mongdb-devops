name: Build and Test Application

on:
  push:
    branches: [tpDockerCompose]
  pull_request:
    branches: [tpDockerCompose]

jobs:
  build_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build MongoDB image
        run: docker build -t dantr3b/mongo-blog:1.0.0 -f mongo/Dockerfile ./mongo

      - name: Build Python API image
        run: docker build -t dantr3b/python-api:1.0.0 -f api/Dockerfile ./api

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        
        with :
          username : ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Docker Scout Scan
        uses: docker/scout-action@v1
        with:
          command: cves, recommendations
          image: dantr3b/mongo-blog:1.0.0
          file: mongo/Dockerfile
          only-severities: cirical, high
          exit-code: true

      - name: Docker Scout Scan
        uses: docker/scout-action@v1
        with:
          command: cves, recommendations
          image: dantr3b/python-api:1.0.0
          file: api/Dockerfile
          only-severities: cirical, high
          exit-code: true

